
name: Breadth Rule Proxy Diario

on:
  schedule:
    # 22:00 UTC de lunes a viernes = tras cierre de mercados USA
    - cron: '0 22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular breadth
        run: python breadth.py

      - name: Commit y push de resultados
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add data/
          git commit -m "Breadth update $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
